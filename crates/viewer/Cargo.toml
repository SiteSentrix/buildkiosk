[package]
name = "buildkiosk-viewer"
description = "The sheet viewer that runs in the browser (WebAssembly): draws PDF pages, pans and zooms, and places markups."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
buildkiosk-model = { workspace = true }
hayro = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlInputElement", "HtmlFormElement",
    "CanvasRenderingContext2d", "ImageData", "DomRect", "Event", "EventTarget", "MouseEvent", "PointerEvent",
    "WheelEvent", "KeyboardEvent", "DomTokenList", "Response", "Headers", "console", "HtmlCollection", "NodeList", "History",
] }

# The same rules as the rest of the workspace (Cargo.toml › workspace.lints), except that the
# `#[wasm_bindgen]` macro writes `unsafe` glue, so `unsafe_code` can't be forbidden here. Nothing in
# this crate writes `unsafe` itself.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
